name: Sync support content

# Push to `develop` touching support sources -> re-run the docs sync so the AI
# assistant's knowledge base, the Help Center Guides tab, and `help_center_faqs`
# never go stale.
#
# Sources:
#   - docs/guides/routes/**/*.md  (Host-facing knowledge Q&A -> knowledge base)
#   - docs/guides/support/faqs.md (curated FAQs -> help_center_faqs, origin=synced)
#
# There is one Supabase project (`fwor…`) serving both develop and production,
# so a separate `main` job would sync the same database twice. The single job
# below is the whole pipeline. Content-only sync (already-reviewed markdown),
# not a schema/function deploy.
#
# Requires `DEV_SUPABASE_SERVICE_ROLE_KEY` in the `development` GitHub
# Environment, plus `SUPABASE_PROJECT_REF` for the project URL.

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/guides/routes/**/*.md'
      - 'docs/guides/support/**/*.md'

concurrency:
  group: help-center-sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate support content
        run: |
          bun scripts/check-support-content.ts
          bun scripts/check-ai-knowledge-coverage.ts

      - name: Sync knowledge base and curated FAQs
        env:
          DEV_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
        run: bun scripts/sync-ai-knowledge-base.ts --dev

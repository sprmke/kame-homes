name: Migration Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/seed.sql'
      - 'scripts/dev/seed-*.sql'
      - 'scripts/dev/probe-rls-anon-local.sh'
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0'

concurrency:
  group: migration-replay
  cancel-in-progress: false

jobs:
  fresh-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLIENT_ID: migration-replay.invalid
      GOOGLE_CLIENT_SECRET: migration-replay
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate migration files
        run: |
          bash scripts/dev/check-migration-versions.sh
          bash scripts/dev/check-migration-security.sh

      - name: Start local Supabase
        run: bun run start:supabase

      - name: Replay every migration from scratch
        run: bun run db:reset

      - name: Lint replayed database
        run: ./scripts/dev/bunx --bun supabase@latest db lint --local --level warning --fail-on error

      - name: Probe RLS deny-by-default as anon (production-readiness doc 22)
        run: bash scripts/dev/probe-rls-anon-local.sh

      - name: Stop local Supabase
        if: always()
        run: bun run stop:supabase

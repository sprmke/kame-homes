name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Filename conventions
        run: bun run check:filenames

      - name: Migration conventions
        run: |
          bash scripts/dev/check-migration-versions.sh
          bash scripts/dev/check-migration-security.sh

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Edge type check (Deno)
        run: bun run check:edge-types

      - name: Edge unit tests (Deno _shared)
        run: bun run test:edge

      - name: servePublic rate-limit coverage
        run: bash scripts/dev/check-serve-public-rate-limit.sh

      - name: Edge handler tests (Deno)
        run: bun run test:edge:handlers

      - name: Install Playwright Chromium
        run: bun x playwright install chromium --with-deps

      - name: Playwright smoke (@smoke)
        run: bun run test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 7

      - name: Build UI
        env:
          # Vite chunk rendering exceeds default ~2GB Node heap on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

      - name: Assert image optimizer stays lazy (plan §10.6)
        run: node scripts/media/assert-lazy-optimizer.mjs

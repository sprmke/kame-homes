<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Back shortly</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #ffffff;
        color: #0f1a1a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
        color: #4a5a5a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1211;
          color: #f2f7f6;
        }
        p {
          color: #b6c4c2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Back shortly</h1>
      <p>We are updating the site. Please try again in a few minutes.</p>
    </main>
  </body>
</html>

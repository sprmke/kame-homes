<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kame Homes - Offline</title>
    <link rel="icon" href="/favicon/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --fg: #1a1a1a;
        --muted: #5b6572;
        --accent: #1f9e88;
        --card: #ffffff;
        --border: #e4e7ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --fg: #f2f2f2;
          --muted: #9aa4b2;
          --accent: #2ab89e;
          --card: #1c1c1c;
          --border: #2a2a2a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 32px 28px;
      }
      .dot {
        width: 44px;
        height: 44px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        display: grid;
        place-items: center;
      }
      .dot svg {
        width: 22px;
        height: 22px;
        stroke: var(--accent);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 20px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        min-height: 44px;
        min-width: 44px;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        This page isn't available without a connection. Your dashboard still works offline once it
        has loaded at least once.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
